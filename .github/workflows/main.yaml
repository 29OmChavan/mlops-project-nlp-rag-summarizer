name: LLMOps CI/CD Pipeline with ROUGE-L Evaluation Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Continuous Integration + ROUGE-L Model Evaluation Gate
  # ─────────────────────────────────────────────────────────────────
  CI-and-Model-Evaluation-Gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: |
          flake8 src tests app.py main.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run LoRA Fine-Tuning, RAG Benchmark & Enforce Evaluation Gate
        env:
          DISABLE_REMOTE_MLFLOW: "1"
          DISABLE_HF_PUSH: "1"
        run: |
          python main.py
          python -c "import json, sys; rep=json.load(open('artifacts/model_evaluation/evaluation_report.json')); print('Gate Passed:', rep['ci_cd_evaluation_gate_passed']); sys.exit(0 if rep['ci_cd_evaluation_gate_passed'] else 1)"
          pytest tests/ -v

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Continuous Delivery — Build & Push to Docker Hub / AWS ECR
  # ─────────────────────────────────────────────────────────────────
  Continuous-Delivery-Docker:
    needs: CI-and-Model-Evaluation-Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Push Image to Docker Hub
        if: env.DOCKER_PAT != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          echo "$DOCKER_PAT" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker build -t $DOCKER_USERNAME/mlops-project-3-nlp-rag-summarizer:latest .
          docker push $DOCKER_USERNAME/mlops-project-3-nlp-rag-summarizer:latest

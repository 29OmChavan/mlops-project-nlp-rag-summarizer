version: "3.9"

services:
  nlp-rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: 29omchavan/mlops-project-3-nlp-rag-summarizer:latest
    container_name: nlp-rag-api
    ports:
      - "8080:8080"
    environment:
      - MLFLOW_TRACKING_URI=https://dagshub.com/29omchavan/mlops-project-3-nlp-rag-summarizer.mlflow
    restart: unless-stopped
